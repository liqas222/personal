<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konkurs Deal Radar</title>
<style>
:root{
  --bg:#05070a; --flaeche:#070b10; --panel:#0a0f15; --rand:#1c2a33;
  --ink:#dfeae6; --ink2:#8fa6a0; --dim:#5d726f;
  --phos:#00e676; --amber:#ffb000; --blut:#ff2d2d;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);
  display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:18px;padding:9px 14px;flex:none;
  border-bottom:1px solid var(--rand);background:#070b10}
.logo{color:var(--phos);font-weight:700;letter-spacing:2px;font-size:13px;
  text-transform:uppercase;white-space:nowrap}
header .rechts{margin-left:auto;color:var(--dim);font-size:10px;
  text-align:right;letter-spacing:1px}
a.knopf{color:var(--phos);text-decoration:none;font-size:11px;
  letter-spacing:1.5px;padding:6px 12px;border:1px solid var(--phos);
  background:#0d2318;white-space:nowrap;flex:none}
a.knopf:hover{background:var(--phos);color:#04100a;font-weight:700}

#leiste{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  background:#070b10;border-bottom:1px solid var(--rand);padding:7px 14px}
#leiste label{color:var(--dim);font-size:9px;letter-spacing:2px}
select,input[type=number]{background:#0a1219;border:1px solid var(--rand);
  color:var(--ink);padding:4px 8px;border-radius:4px;font:inherit;
  font-size:11px}
button{background:#0a1219;border:1px solid var(--rand);color:var(--ink2);
  padding:4px 11px;border-radius:4px;cursor:pointer;font:inherit;
  font-size:10px;letter-spacing:.1em}
button:hover{border-color:var(--ink2);color:var(--ink)}
button.gruen{background:#0d2318;border-color:var(--phos);color:var(--phos)}
button.gruen:hover{background:#143623}
.kchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border:1px solid var(--rand);border-radius:4px;cursor:pointer;font-size:10px;
  color:var(--ink2);letter-spacing:.08em}
.kchip.an{border-color:var(--phos);color:var(--phos);background:#0d2318}

main{flex:1;display:flex;min-height:0}
#liste{flex:1;overflow:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;background:#0a1219;color:var(--dim);font-size:9px;
  letter-spacing:1.5px;text-align:left;padding:8px 10px;font-weight:400;
  border-bottom:1px solid var(--rand);white-space:nowrap;z-index:1}
td{padding:8px 10px;border-bottom:1px solid #101a20;vertical-align:top}
tr:hover td{background:#0b1218}
tr.gewaehlt td{background:#0d1a14}
.firma{font-weight:700;color:var(--ink);cursor:pointer}
.klein{color:var(--dim);font-size:10px}
.score{font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.s-hoch{color:var(--phos)} .s-mittel{color:var(--amber)} .s-tief{color:var(--dim)}
.assets{color:var(--ink2);font-size:10.5px;max-width:260px}
.vermutet{color:var(--amber);font-size:9px;letter-spacing:.08em}
.stat{background:#0a1219;border:1px solid var(--rand);border-radius:3px;
  color:var(--ink2);padding:2px 7px;font-size:10px}

aside{width:34%;min-width:340px;max-width:520px;flex:none;background:var(--panel);
  border-left:1px solid var(--rand);display:flex;flex-direction:column}
.pkopf{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none;
  border-bottom:1px solid var(--rand);color:var(--phos);font-size:11px;
  letter-spacing:1.5px}
.pkopf button{margin-left:auto}
#detail{flex:1;overflow:auto;padding:14px}
#detail h2{font-size:15px;margin:0 0 2px;color:var(--ink)}
.zeile{display:flex;gap:10px;padding:4px 0;font-size:11px;
  border-bottom:1px solid #101a20}
.zeile .k{color:var(--dim);flex:0 0 118px}
.zeile .v{color:var(--ink2);flex:1}
h3{font-size:10px;letter-spacing:2px;color:var(--dim);margin:16px 0 6px;
  font-weight:400}
.pz{display:flex;gap:8px;font-size:11px;padding:3px 0;color:var(--ink2)}
.pz b{flex:0 0 42px;text-align:right}
.plus b{color:var(--phos)} .minus b{color:#ff6b6b}
.pz span.q{color:var(--dim);font-size:9.5px}
.warn{border:1px solid #4a3a10;background:#17130a;border-radius:6px;
  padding:9px 10px;color:var(--ink2);font-size:10.5px;line-height:1.6;
  margin-bottom:8px}
.warn b{color:var(--amber)}
.schritt{border:1px solid var(--phos);background:#0d2318;border-radius:6px;
  padding:10px;color:var(--ink);font-size:11.5px;line-height:1.6;margin:10px 0}
.schritt b{color:var(--phos)}
pre.meldung{background:#080d12;border:1px solid var(--rand);border-radius:6px;
  padding:10px;font-size:10.5px;line-height:1.55;white-space:pre-wrap;
  color:var(--ink2);max-height:320px;overflow:auto}
#fuss{flex:none;display:flex;gap:0;background:#0a1219;
  border-top:1px solid var(--rand);font-size:10px;letter-spacing:1px}
#fuss .f{padding:7px 14px;border-right:1px solid var(--rand);color:var(--dim)}
#fuss b{color:var(--ink2)}
#fuss .f.rechts{margin-left:auto;border-right:0}
.leer{padding:40px;text-align:center;color:var(--dim);line-height:1.8}
.quelle-aus{color:var(--amber)}
.quelle-an{color:var(--phos)}
@media (max-width:900px){
  aside{position:fixed;inset:auto 0 0 0;width:auto;height:55%;
    border-left:0;border-top:1px solid var(--rand);z-index:5}
}
</style>
</head>
<body>

<header>
  <div class="logo">◧ Konkurs Deal Radar</div>
  <a class="knopf" href="../">← Atlas</a>
  <div class="rechts">
    Schweiz · SHAB, Amtsblätter, Konkursämter ·
    <span id="stand">–</span>
  </div>
</header>

<div id="leiste">
  <label>KANTON</label>
  <div id="kantone"></div>
  <label>SCORE AB</label>
  <input type="number" id="minscore" value="0" min="0" max="100" step="5"
         style="width:64px">
  <label>BRANCHE</label>
  <select id="branche"><option value="">alle</option></select>
  <label>STATUS</label>
  <select id="status"><option value="">alle</option></select>
  <button class="gruen" id="abrufen">Jetzt abrufen</button>
  <select id="zeitraum" title="Wie weit zurück geholt wird">
    <option value="">seit dem letzten Lauf</option>
    <option value="7">letzte 7 Tage</option>
    <option value="30">letzte 30 Tage</option>
    <option value="90">letzte 90 Tage</option>
    <option value="365">letztes Jahr</option>
  </select>
  <button id="zweckKnopf" title="Bestehenden Fällen Zweck und Gründungsdatum aus dem Handelsregister nachtragen und neu bewerten">HR-Daten nachtragen</button>
  <button id="importKnopf">Datei importieren</button>
  <input type="file" id="datei" hidden accept=".csv,.json,.pdf">
  <button id="csv">CSV</button>
  <button id="xlsx">Excel</button>
  <button id="meldung">Tagesmeldung</button>
  <span id="importMeldung" class="klein"></span>
</div>

<main>
  <div id="liste"></div>
  <aside>
    <div class="pkopf"><span id="pTitel">KEIN FALL GEWÄHLT</span></div>
    <div id="detail"></div>
  </aside>
</main>

<div id="fuss">
  <div class="f">FÄLLE: <b id="fGesamt">–</b></div>
  <div class="f">AB SCORE <b id="fSchwelleWert">–</b>: <b id="fSchwelle">–</b></div>
  <div class="f">QUELLEN: <b id="fQuellen">–</b></div>
  <div class="f">LETZTER LAUF: <b id="fLauf">–</b></div>
  <div class="f rechts">Vermutete Assets sind abgeleitet, nicht bestätigt ·
    Kontakt ausschliesslich Konkursamt</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let SCHWELLE = 50;   // wird aus /api/zustand nachgezogen
// Die Kantonsknöpfe waren fest auf sechs verdrahtet. Sobald der Abruf
// mehr Kantone holt, wäre der Rest nicht filterbar und im Zweifel gar
// nicht sichtbar. Deshalb kommen sie jetzt aus den Daten: gezeigt wird,
// was tatsächlich erfasst ist.
let KANTONE = [];
let gewaehlteKantone = new Set();   // leer = keine Einschränkung
let FAELLE = [];

function filterParam() {
  const p = new URLSearchParams();
  if (gewaehlteKantone.size && gewaehlteKantone.size < KANTONE.length)
    p.set("kanton", [...gewaehlteKantone].join(","));
  p.set("min_score", $("minscore").value || "0");
  if ($("branche").value) p.set("branche", $("branche").value);
  if ($("status").value) p.set("status", $("status").value);
  return p;
}

function bauKantone(vorhanden) {
  // Ein Knopf je Kanton, der wirklich Fälle hat. Kein Kanton in den
  // Daten: gar keine Knöpfe — sechs tote Schalter wären nur Zierde.
  const neu = (vorhanden || []).filter((k) => k && k !== "?").sort();
  if (neu.join() === KANTONE.join()) return;
  KANTONE = neu;
  gewaehlteKantone = new Set(KANTONE);
  $("kantone").innerHTML = KANTONE.map((k) =>
    '<span class="kchip an" data-k="' + k + '">' + k + "</span>").join(" ");
  $("kantone").querySelectorAll(".kchip").forEach((c) => {
    c.onclick = () => {
      const k = c.dataset.k;
      gewaehlteKantone.has(k) ? gewaehlteKantone.delete(k)
                              : gewaehlteKantone.add(k);
      c.classList.toggle("an", gewaehlteKantone.has(k));
      laden();
    };
  });
}

function scoreKlasse(s) {
  return s >= SCHWELLE + 20 ? "s-hoch"
       : s >= SCHWELLE ? "s-mittel" : "s-tief";
}

async function laden() {
  const r = await fetch("api/faelle?" + filterParam());
  const d = await r.json();
  FAELLE = d.faelle;

  if ($("branche").options.length <= 1) {
    for (const b of d.zahlen.branchen)
      if (b) $("branche").add(new Option(b, b));
    for (const s of d.status_werte) $("status").add(new Option(s, s));
  }
  $("fGesamt").textContent = d.zahlen.gesamt;
  $("fSchwelle").textContent = d.zahlen.ueber_schwelle;
  $("fSchwelleWert").textContent = d.zahlen.schwelle;
  // Die Farbgrenze muss der echten Schwelle folgen, sonst
  // steht ein grün markierter Fall unter der Linie.
  SCHWELLE = d.zahlen.schwelle || SCHWELLE;

  if (!FAELLE.length) {
    // „Nichts da" und „nichts über der Schwelle" sind zwei verschiedene
    // Lagen. Sind Fälle erfasst, ist der Rat „importiere eine Datei"
    // schlicht falsch — und er verdeckt, dass der Filter der Grund ist.
    const gesamt = Number(d.zahlen.gesamt) || 0;
    $("liste").innerHTML = gesamt
      ? '<div class="leer"><b>' + gesamt + " Fälle erfasst, aber keiner " +
        "passt auf diese Filter.</b><br>Score ab <b>" +
        ($("minscore").value || 0) + "</b> ist die wahrscheinlichste " +
        "Ursache." +
        "<br><br>Konkurspublikationen enthalten <b>keinen " +
        "Zweckartikel</b> — der steht im Handelsregister. Ohne ihn " +
        "trägt nur der Firmenname, und die meisten Fälle bleiben " +
        "deshalb unter " + SCHWELLE + "." +
        '<br><br><button id="alleZeigen">Alle Fälle zeigen (Score ab 0)' +
        "</button></div>"
      : '<div class="leer">Noch keine Fälle.' +
        "<br>„Jetzt abrufen“ drücken oder eine CSV-, JSON- oder " +
        "PDF-Datei importieren." +
        "<br><br>Beispieldatei: <b>radar/beispiel/konkurse.csv</b></div>";
    const knopf = $("alleZeigen");
    if (knopf) knopf.onclick = () => { $("minscore").value = 0; laden(); };
    return;
  }
  const kopf = ["Firma", "Ort", "KT", "Branche", "Publiziert", "Meldungsart",
                "Vermutete Assets", "Score", "Konkursamt", "Status"];
  $("liste").innerHTML = "<table><thead><tr>" +
    kopf.map((k) => "<th>" + k + "</th>").join("") + "</tr></thead><tbody>" +
    FAELLE.map((f) =>
      '<tr data-id="' + f.id + '">' +
      '<td><span class="firma">' + esc(f.firma) + "</span>" +
      (f.uid ? '<div class="klein">' + f.uid + "</div>" : "") + "</td>" +
      "<td>" + esc(f.ort || "") + "</td>" +
      "<td>" + (f.kanton || "") + "</td>" +
      "<td>" + esc(f.branche || "") +
      (f.alter_jahre != null ? '<div class="klein">' + f.alter_jahre +
        " Jahre</div>" : "") + "</td>" +
      "<td>" + (f.publikationsdatum || "") + "</td>" +
      "<td>" + esc(f.art_text || "") + "</td>" +
      '<td class="assets">' + esc((f.assets || []).slice(0, 4).join(", ")) +
      (f.assets && f.assets.length ? '<div class="vermutet">VERMUTET</div>'
                                   : "") + "</td>" +
      '<td class="score ' + scoreKlasse(f.score) + '">' + f.score + "</td>" +
      "<td>" + esc(f.konkursamt || "–") + "</td>" +
      '<td><span class="stat">' + f.status + "</span></td></tr>").join("") +
    "</tbody></table>";

  $("liste").querySelectorAll("tr[data-id]").forEach((tr) => {
    tr.onclick = () => zeigeFall(tr.dataset.id, tr);
  });
}

function esc(t) {
  return String(t == null ? "" : t).replace(/[<>&]/g, (c) =>
    ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
}

async function zeigeFall(id, tr) {
  document.querySelectorAll("tr.gewaehlt").forEach((x) =>
    x.classList.remove("gewaehlt"));
  if (tr) tr.classList.add("gewaehlt");
  const f = await (await fetch("api/fall/" + id)).json();
  $("pTitel").textContent = f.firma.toUpperCase();

  const z = (k, v) => v ? '<div class="zeile"><span class="k">' + k +
    '</span><span class="v">' + v + "</span></div>" : "";

  $("detail").innerHTML =
    "<h2>" + esc(f.firma) + "</h2>" +
    '<div class="klein">' + esc(f.ort || "") + " · " + (f.kanton || "") +
    (f.uid ? " · " + f.uid : "") + "</div>" +

    '<div class="schritt"><b>Nächster Schritt</b><br>' +
    esc(f.naechster_schritt) + "</div>" +

    "<h3>MELDUNG</h3>" +
    z("Art", esc(f.art_text)) +
    z("Publiziert", f.publikationsdatum) +
    z("Konkurs", f.konkursdatum) +
    z("Konkursamt", esc(f.konkursamt)) +
    z("Aktenzeichen", esc(f.aktenzeichen)) +
    z("Quelle", f.quelle_url
      ? '<a href="' + esc(f.quelle_url) + '" target="_blank" rel="noopener" ' +
        'style="color:var(--phos)">' + esc(f.quelle_url) + "</a>"
      : esc(f.quelle)) +

    "<h3>FIRMA</h3>" +
    z("Branche", esc(f.branche)) +
    z("Zweck", esc(f.zweck)) +
    z("Gegründet", f.gruendung + (f.alter_jahre != null
      ? " (" + f.alter_jahre + " Jahre)" : "")) +

    "<h3>VERMUTETE ASSETS</h3>" +
    '<div class="warn"><b>Vermutet, nicht bestätigt.</b> Abgeleitet aus dem ' +
    "Zweckartikel im Handelsregister. Verbindlich ist allein das Inventar " +
    "des Konkursamts.</div>" +
    ((f.assets || []).map((a) => '<div class="pz"><b>·</b>' + esc(a) +
      "</div>").join("") || '<div class="klein">Keine ableitbar.</div>') +

    "<h3>SCORE " + f.score + " / 100</h3>" +
    (f.begruendung || []).map((r) =>
      '<div class="pz ' + (r.punkte >= 0 ? "plus" : "minus") + '"><b>' +
      (r.punkte > 0 ? "+" : "") + r.punkte + "</b><span>" + esc(r.grund) +
      ' <span class="q">(' + esc(r.quelle) + ")</span></span></div>").join("") +
    '<div class="klein" style="margin-top:8px">Der Score ist eine ' +
    "Sortierhilfe, keine Wertangabe. Die Gewichte sind gesetzt, nicht " +
    "gemessen.</div>" +

    "<h3>EINSCHRÄNKUNGEN</h3>" +
    (f.einschraenkungen || []).map((e) =>
      '<div class="warn">' + esc(e) + "</div>").join("") +

    "<h3>STATUS</h3>" +
    '<select id="statusWahl">' +
    ["Neu", "Aktualisiert", "Kontakt empfohlen", "Inventarliste angefragt",
     "Besichtigung", "Beobachten", "Verworfen"].map((s) =>
      '<option' + (s === f.status ? " selected" : "") + ">" + s +
      "</option>").join("") + "</select>" +

    ((f.verwandte || []).length ? "<h3>WEITERE MELDUNGEN ZU DIESER FIRMA</h3>" +
      f.verwandte.map((v) => '<div class="zeile"><span class="k">' +
        (v.publikationsdatum || "") + '</span><span class="v">' +
        esc(v.art_text) + " · Score " + v.score + "</span></div>").join("")
      : "") +

    "<h3>BENACHRICHTIGUNGSTEXT</h3>" +
    '<pre class="meldung">' + esc(f.meldung) + "</pre>";

  $("statusWahl").onchange = async (e) => {
    await fetch("api/status", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: f.id, status: e.target.value }) });
    laden();
  };
}

async function zustand() {
  const d = await (await fetch("api/zustand")).json();
  $("fQuellen").innerHTML = d.quellen.map((q) =>
    '<span class="' + (q.bereit ? "quelle-an" : "quelle-aus") + '" title="' +
    esc(q.hinweis) + '">' + q.name + (q.bereit ? " ✓" : " ✕") + "</span>"
  ).join(" · ");
  const l = d.letzter_lauf;
  // Die Bemerkung erklärt ein Ergebnis, das sonst rätselhaft wäre —
  // vor allem „0 gelesen". Ohne sie ist nicht zu unterscheiden, ob es
  // nichts zu holen gab oder ob etwas nicht stimmt.
  $("fLauf").textContent = l
    ? (l.beendet || "").replace("T", " ") + " · " + l.gelesen + " gelesen, " +
      l.neu + " neu" + (l.bemerkung ? " — " + l.bemerkung : "")
    : "noch keiner";
  bauKantone(Object.keys(d.zahlen.nach_kanton || {}));
  $("stand").textContent = d.zahlen.gesamt + " Fälle erfasst";
}

$("abrufen").onclick = async () => {
  $("abrufen").disabled = true;
  $("importMeldung").textContent = "rufe Amtsblattportal ab …";
  try {
    // POST, nicht GET: der Abruf holt Daten und schreibt sie weg, das ist
    // eine Änderung und kein Lesen.
    const tage = $("zeitraum").value;
    const d = await (await fetch("api/abrufen", {
      method: "POST",
      body: JSON.stringify(tage ? { tage: Number(tage) } : {}),
    })).json();
    $("importMeldung").textContent = d.fehler
      ? "Abruf fehlgeschlagen: " + d.fehler
      : (d.seit ? "ab " + d.seit + ": " : "") +
        d.gelesen + " gelesen · " + d.neu + " neu · " + d.aktualisiert +
        " aktualisiert" + (d.bemerkung ? " — " + d.bemerkung : "");
    if (d.protokoll) console.log(d.protokoll.join("\n"));
  } catch (e) {
    $("importMeldung").textContent = "Fehler: " + e.message;
  }
  $("abrufen").disabled = false;
  laden(); zustand();
};

$("zweckKnopf").onclick = async () => {
  $("zweckKnopf").disabled = true;
  $("importMeldung").textContent = "schlage im Handelsregister nach …";
  try {
    const d = await (await fetch("api/zweck", { method: "POST" })).json();
    $("importMeldung").textContent = d.fehler
      ? "Nicht möglich: " + d.fehler
      : !d.geprueft
        ? "Nichts nachzutragen — alle Fälle haben Zweck und Gründungsdatum."
        : d.geprueft + " Fälle mit Lücke geprüft · " + d.zwecke +
          " Zweckartikel, " + d.gruendungen + " Gründungsdaten ergänzt" +
          (d.ergaenzt ? "" :
            " — nichts gefunden; siehe radar.pruefen Schritt 5") +
          (d.ohne_uid ? " · " + d.ohne_uid + " ohne gültige UID" : "");
  } catch (e) {
    $("importMeldung").textContent = "Fehler: " + e.message;
  }
  $("zweckKnopf").disabled = false;
  laden(); zustand();
};

$("importKnopf").onclick = () => $("datei").click();
$("datei").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  $("importMeldung").textContent = "lese " + f.name + " …";
  const r = await fetch("api/import", { method: "POST",
    headers: { "X-Dateiname": encodeURIComponent(f.name) },
    body: await f.arrayBuffer() });
  const d = await r.json();
  $("importMeldung").textContent = d.fehler
    ? "Fehler: " + d.fehler
    : d.gelesen + " gelesen · " + d.neu + " neu · " + d.aktualisiert +
      " aktualisiert · " + d.verworfen + " verworfen" +
      (d.probleme && d.probleme.length ? " · " + d.probleme.length +
        " Hinweise" : "");
  if (d.probleme && d.probleme.length) console.log(d.probleme);
  e.target.value = "";
  laden(); zustand();
};

$("csv").onclick = () => location.href = "export.csv?" + filterParam();
$("xlsx").onclick = () => location.href = "export.xlsx?" + filterParam();
$("meldung").onclick = async () => {
  const d = await (await fetch("api/meldung")).json();
  $("pTitel").textContent = "TAGESMELDUNG";
  $("detail").innerHTML = "<h3>" + d.anzahl + " FÄLLE</h3>" +
    '<pre class="meldung">' + esc(d.text) + "</pre>" +
    (d.anzahl ? '<button class="gruen" id="alsGemeldet" ' +
      'style="margin-top:10px">Als gemeldet markieren</button>' : "");
  if (d.anzahl) $("alsGemeldet").onclick = async () => {
    await fetch("api/gemeldet", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: d.ids }) });
    $("alsGemeldet").disabled = true;
    $("alsGemeldet").textContent = "markiert";
  };
};
$("minscore").onchange = laden;
$("branche").onchange = laden;
$("status").onchange = laden;

laden();
zustand();
</script>
</body>
</html>
