<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — Meerengen der Weltpolitik</title>
<style>
:root{
  --bg:#0b0f16; --flaeche:#0e1520; --panel:#131b26; --rand:#222c3a;
  --ink:#f2f4f7; --ink2:#a8b2c1; --dim:#6f7a8a;
  --blau:#3987e5; --orange:#d95926; --rot:#e66767; --gruen:#199e70;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:18px;padding:12px 18px;
  border-bottom:1px solid var(--rand);background:#0a0e15;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:3px;
  font-size:13px;text-transform:uppercase}
.logo b{color:var(--blau);font-size:18px;letter-spacing:0}
nav{display:flex;gap:4px;margin-left:8px}
nav button{background:none;border:1px solid transparent;color:var(--ink2);
  padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
nav button:hover{color:var(--ink);background:#151d2a}
nav button.an{color:var(--ink);background:#182231;border-color:var(--rand)}
header .rechts{margin-left:auto;color:var(--dim);font-size:11px;text-align:right}

main{flex:1;display:flex;min-height:0}
#kartenfeld{flex:1;position:relative;min-width:0;overflow:hidden}
canvas{display:block}

/* Meldungen ueber der Karte */
#zurueck{position:absolute;top:14px;left:14px;background:#131b26cc;
  backdrop-filter:blur(6px);border:1px solid var(--rand);color:var(--ink);
  padding:7px 13px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
#zurueck:hover{background:#1c2635}
#ansichten{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;background:#131b26cc;backdrop-filter:blur(6px);
  border:1px solid var(--rand);border-radius:8px;padding:3px}
#ansichten button{background:none;border:0;color:var(--ink2);padding:6px 14px;
  border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
#ansichten button:hover{color:var(--ink)}
#ansichten button.an{background:#26344a;color:var(--ink)}
body:not([data-modus="detail"]) #ansichten{display:none}
#legende{position:absolute;bottom:14px;left:14px;background:#0b0f16dd;
  backdrop-filter:blur(6px);border:1px solid var(--rand);border-radius:8px;
  padding:10px 14px;font-size:12px;color:var(--ink2);max-width:340px}
#legende .z{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#legende .z:last-of-type{margin-bottom:0}
#legende i{width:13px;height:13px;border-radius:3px;flex:none;
  border:1.5px solid}
#legende .hw{margin-top:9px;padding-top:9px;border-top:1px solid var(--rand);
  color:var(--dim);line-height:1.45}
#hinweis{position:absolute;bottom:14px;left:14px;color:var(--dim);font-size:11px;
  background:#0b0f16aa;padding:5px 9px;border-radius:5px;pointer-events:none}

/* Seitenpanel */
#panel{width:400px;flex:none;border-left:1px solid var(--rand);background:var(--panel);
  overflow-y:auto;padding:22px 24px 40px}
#panel h2{margin:0;font-size:21px;line-height:1.25}
#panel .reg{color:var(--blau);font-size:11px;letter-spacing:2px;
  text-transform:uppercase;margin:6px 0 18px}
#panel h3{margin:22px 0 7px;font-size:12px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--ink2);font-weight:600}
#panel p{margin:0;color:#d3d9e2}
.fakten{border-top:1px solid var(--rand);border-bottom:1px solid var(--rand);
  padding:4px 0}
.fakten .z{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #1b2431}
.fakten .z:last-child{border-bottom:0}
.fakten .k{color:var(--dim);flex:none;width:88px;font-size:12px;
  text-transform:uppercase;letter-spacing:.7px;padding-top:1px}
.fakten .v{color:var(--ink);font-size:13px}
.tag{background:#3a2a12;color:#e0a03a;font-size:9px;padding:2px 6px;
  border-radius:3px;letter-spacing:.5px;margin-left:6px;vertical-align:middle}
.legende{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px;
  color:var(--ink2);font-size:12px}
.legende i{display:inline-block;width:12px;height:3px;border-radius:2px;
  margin-right:6px;vertical-align:middle}
.bt{width:100%;margin-top:14px;background:#1b2637;border:1px solid var(--rand);
  color:var(--ink);padding:9px 12px;border-radius:7px;cursor:pointer;font:inherit;
  font-size:13px}
.bt:hover{background:#24324a;border-color:#3a4c68}
body[data-ansicht="betroffen"] .bt{display:none}
ul.q{margin:0;padding-left:17px;color:var(--dim);font-size:12px}
ul.q li{margin-bottom:5px}

/* Liste */
#liste{display:none;padding:22px;gap:14px;overflow-y:auto;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-content:start}
.karte{text-align:left;background:var(--panel);border:1px solid var(--rand);
  border-radius:10px;padding:16px 18px;cursor:pointer;color:var(--ink);font:inherit}
.karte:hover{border-color:#33465e;background:#161f2c}
.karte h3{margin:0 0 3px;font-size:16px}
.karte .reg{color:var(--blau);font-size:10px;letter-spacing:1.6px;
  text-transform:uppercase;margin-bottom:9px}
.karte p{margin:0 0 10px;color:var(--ink2);font-size:12.5px}
.karte .mini{color:var(--dim);font-size:11px;border-top:1px solid var(--rand);
  padding-top:8px}

/* Quiz */
#quizleiste{display:none;align-items:center;gap:16px;padding:12px 18px;
  border-top:1px solid var(--rand);background:#0a0e15;flex:none}
#qfrage{font-size:16px;font-weight:600}
#qhilfe,#qergebnis{font-size:13px;color:var(--ink2)}
#qergebnis.gut{color:var(--gruen)}
#qergebnis.ok{color:#e0a03a}
#qergebnis.schlecht{color:var(--rot)}
#quizleiste .rechts{margin-left:auto;display:flex;align-items:center;gap:14px}
#qpunkte{color:var(--dim);font-size:12px;letter-spacing:1px}
#weiter{background:var(--blau);border:0;color:#fff;padding:8px 18px;
  border-radius:6px;cursor:pointer;font:inherit;font-weight:600}

/* Was in welchem Modus sichtbar ist */
body[data-modus="welt"] #panel,
body[data-modus="quiz"] #panel,
body[data-modus="liste"] #panel{display:none}
body[data-modus="liste"] #kartenfeld{display:none}
body[data-modus="liste"] #liste{display:grid;flex:1}
body[data-modus="quiz"] #quizleiste{display:flex}
body:not([data-modus="detail"]) #zurueck{display:none}
body[data-modus="detail"] #hinweis,body[data-modus="quiz"] #hinweis{display:none}

@media (max-width:900px){
  #panel{position:absolute;inset:auto 0 0 0;width:auto;height:52%;
    border-left:0;border-top:1px solid var(--rand)}
  main{position:relative}
}
</style>
</head>
<body data-modus="welt">

<header>
  <div class="logo"><b>◈</b> Atlas</div>
  <nav>
    <button data-modus="welt" class="an">Weltkarte</button>
    <button data-modus="liste">Meerengen</button>
    <button data-modus="quiz">Quiz</button>
  </nav>
  <div class="rechts">
    Karte: Natural Earth (Public Domain)<br><span id="stand"></span>
  </div>
</header>

<main>
  <div id="kartenfeld">
    <canvas id="karte"></canvas>
    <button id="zurueck">← Weltkarte</button>
    <div id="ansichten">
      <button data-ansicht="enge" class="an">Die Enge</button>
      <button data-ansicht="betroffen">Wer hängt daran</button>
    </div>
    <div id="legende" hidden></div>
    <div id="hinweis">Klick auf einen Punkt, um die Meerenge zu öffnen.</div>
  </div>
  <div id="liste"></div>
  <aside id="panel"></aside>
</main>

<div id="quizleiste">
  <span id="qfrage"></span>
  <span id="qhilfe"></span>
  <span id="qergebnis"></span>
  <div class="rechts">
    <span id="qpunkte"></span>
    <button id="weiter" hidden>Weiter</button>
  </div>
</div>

<script src="world.js"></script>
<script src="geo.js"></script>
<script src="data.js"></script>
<script src="atlas.js"></script>
</body>
</html>
