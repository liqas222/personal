<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — Meerengen der Weltpolitik</title>
<style>
:root{
  --bg:#05070a; --flaeche:#070b10; --panel:#0a0f15; --rand:#1c2a33;
  --ink:#dfeae6; --ink2:#8fa6a0; --dim:#5d726f;
  --phos:#00e676;          /* Phosphorgrün — Chrome, aktive Schalter */
  --amber:#ffb000;         /* Amber — Warnstufe, Hervorhebung */
  --blut:#ff2d2d;          /* Blutrot — Bedrohung, Konflikt */
  --blau:#3987e5; --orange:#d95926; --rot:#ff2d2d; --gruen:#00e676;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.5 var(--mono);
  display:flex;flex-direction:column;overflow:hidden}

/* Klassifizierungsbanner oben und unten — Stilelement. Der Übungsvermerk
   steht bewusst daneben: die Karte darf nicht mit einem echten
   Verschlusssachen-Produkt verwechselbar sein. */
header{display:flex;align-items:center;gap:18px;padding:9px 14px;
  border-bottom:1px solid var(--rand);background:#070b10;flex:none;
  box-shadow:0 1px 0 #0d2a1c}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:3px;
  font-size:13px;text-transform:uppercase}
.logo{color:var(--phos);text-shadow:0 0 12px #00e67655}
.logo b{color:var(--phos);font-size:16px;letter-spacing:0}
nav{display:flex;gap:4px;margin-left:8px}
nav button{background:none;border:1px solid #16303a;color:var(--ink2);
  padding:5px 13px;cursor:pointer;font:inherit;font-size:11px;
  letter-spacing:1.5px;text-transform:uppercase}
nav button:hover{color:var(--phos);border-color:#1f4d3a}
nav button.an{color:#04100a;background:var(--phos);border-color:var(--phos);
  font-weight:700;box-shadow:0 0 14px #00e67655}
header .rechts{margin-left:auto;color:var(--dim);font-size:10px;text-align:right;
  letter-spacing:1px}
/* Deutlich sichtbarer Knopf ganz rechts. Als kleines graues Symbol mitten
   in der Leiste war er faktisch unsichtbar. */
main{flex:1;display:flex;min-height:0}
#kartenfeld{flex:1;position:relative;min-width:0;overflow:hidden}
canvas{display:block}
/* Scanlines und leichtes Rauschen — rein visuell, liegt ueber der Karte und
   faengt keine Klicks ab. */
#kartenfeld::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px,
    transparent 1px, transparent 3px);
  mix-blend-mode:multiply}
#kartenfeld::before{content:"";position:absolute;inset:0;pointer-events:none;
  z-index:2;
  background:radial-gradient(ellipse at center,
    transparent 55%, rgba(0,0,0,.45) 100%)}

/* Meldungen ueber der Karte */
#zurueck{position:absolute;top:14px;left:14px;background:#131b26cc;
  backdrop-filter:blur(6px);border:1px solid var(--rand);color:var(--ink);
  padding:7px 13px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
#zurueck:hover{background:#1c2635}
#ansichten{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;background:#131b26cc;backdrop-filter:blur(6px);
  border:1px solid var(--rand);border-radius:8px;padding:3px}
#ansichten button{background:none;border:0;color:var(--ink2);padding:6px 14px;
  border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
#ansichten button:hover{color:var(--ink)}
#ansichten button.an{background:#26344a;color:var(--ink)}
body:not([data-modus="detail"]) #ansichten{display:none}
#legende{position:absolute;bottom:14px;left:14px;background:#0b0f16dd;
  backdrop-filter:blur(6px);border:1px solid var(--rand);border-radius:8px;
  padding:10px 14px;font-size:12px;color:var(--ink2);max-width:340px}
#legende .z{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#legende .z:last-of-type{margin-bottom:0}
#legende i{width:13px;height:13px;border-radius:3px;flex:none;
  border:1.5px solid}
body:not([data-modus="detail"]) #legende{display:none}
#legende .hw{margin-top:9px;padding-top:9px;border-top:1px solid var(--rand);
  color:var(--dim);line-height:1.45}
#hinweis{position:absolute;bottom:14px;left:14px;color:var(--dim);font-size:10px;
  background:#060a0edd;border:1px solid #16302a;padding:6px 10px;
  letter-spacing:1px;pointer-events:none}
#hinweis b{color:var(--phos);font-weight:700}
/* Erscheint erst, wenn der Ausschnitt von Hand verstellt wurde — sonst wäre
   es ein Knopf ohne Wirkung. */
#zuruecksetzen{position:absolute;top:14px;left:14px;background:#0a1a12e8;
  backdrop-filter:blur(6px);border:1px solid #1f5a3e;color:var(--phos);
  padding:6px 12px;cursor:pointer;font:inherit;font-size:10px;letter-spacing:1.5px}
#zuruecksetzen:hover{background:#13301f}
body:not([data-frei="ja"]) #zuruecksetzen{display:none}
body[data-modus="detail"][data-frei="ja"] #zuruecksetzen{left:auto;right:280px;top:14px}

/* Ebenenleiste — fest unter dem Kopf statt als Fenster über der Karte.
   Ein Schaltpult, das die Karte verdeckt, ist genau da im Weg, wo man
   hinschaut. */
/* Umbrechen statt seitlich scrollen: mit der Zeitraumwahl davor passte die
   Ebenenliste nicht mehr in eine Zeile und lief rechts über den Zähler. Ein
   verstecktes Seitwärtsscrollen findet niemand — zwei Reihen schon. */
#leiste{flex:none;display:flex;align-items:stretch;flex-wrap:wrap;gap:0;
  background:#070b10;border-bottom:1px solid var(--rand)}
#leiste .lb{display:flex;align-items:center;padding:0 12px;color:var(--dim);
  font-size:9px;letter-spacing:2px;flex:none;border-right:1px solid var(--rand)}
#leiste .lb.re{margin-left:auto;border-right:0;border-left:1px solid var(--rand);
  color:var(--phos)}
/* Der Schalter selbst — kleine Leuchtdiode */

/* Legende der Statusfarben */

/* Auswahlleiste */
/* Erklärt die Bögen zu den Handelspartnern. Ohne sie sieht man nur Linien
   und weiss nicht, in welche Richtung gehandelt wird und womit. */
#bogenlegende{position:absolute;bottom:52px;left:14px;max-width:300px;
  background:#060a0eee;backdrop-filter:blur(8px);border:1px solid var(--rand);
  border-radius:8px;padding:10px 12px;font-size:10.5px;line-height:1.55;
  color:var(--ink2)}
body[data-auswahl="nein"] #bogenlegende{display:none}
#bogenlegende .bt2{color:var(--dim);letter-spacing:1.6px;font-size:9px;
  margin-bottom:7px}
#bogenlegende .bz{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#bogenlegende .bl{width:26px;height:0;border-top:2px solid;flex:none}
#bogenlegende .bw{margin-top:8px;padding-top:8px;
  border-top:1px solid var(--rand);color:var(--dim);line-height:1.5}
#bogenlegende b{color:var(--ink2)}

#auswahl{position:absolute;bottom:14px;left:14px;right:14px;display:flex;
  flex-wrap:wrap;align-items:center;gap:6px}
body[data-auswahl="nein"] #auswahl{display:none}
#auswahl .tit{color:var(--dim);font-size:10px;letter-spacing:2px;margin-right:4px}
#auswahl .chip{background:#0a1a12e8;border:1px solid #1f5a3e;color:var(--phos);
  font:inherit;font-size:11px;letter-spacing:.8px;padding:4px 9px;cursor:pointer}
#auswahl .chip:hover{background:#13301f;border-color:var(--phos)}
#auswahl .chip span{color:var(--dim);margin-left:3px}
#auswahl .chip.leer{border-color:#4a2a2a;color:#ff8a8a}
body[data-auswahl="ja"] #hinweis{display:none}
/* Bei Auswahl das Panel auch in der Weltkarte zeigen */


/* Handelsprofile im Panel */
.hv.hinw{color:var(--dim);font-size:10.5px;line-height:1.55}
.pz{display:block;color:var(--ink2);font-size:11px;line-height:1.6}
.pz b{color:var(--phos);font-weight:700}
.pz.rest{color:var(--dim)}
.pz.rest b{color:var(--amber)}
.hbox{border-top:1px solid var(--rand);padding-top:14px;margin-top:16px}
.hbox h3{margin:0 0 6px;font-size:15px;color:var(--phos);letter-spacing:1px}
.hbox .kern{color:var(--ink2);font-size:12px;margin:0 0 11px;line-height:1.5}
.hz{display:flex;gap:9px;padding:4px 0;font-size:12px;align-items:baseline}
.hk{color:var(--dim);flex:none;width:84px;font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase}
.hv{color:var(--ink);flex:1}
.eng{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:5px 0 5px 93px;
  font-size:12px;color:var(--ink)}
.eng .pkt{width:7px;height:7px;border-radius:50%;flex:none}
.eng .pct{color:var(--amber);font-weight:700}
.eng .qq{flex-basis:100%;color:var(--dim);font-size:10px;padding-left:14px}
.spark{width:100%;height:54px;display:block;margin:4px 0 2px;
  background:#060c09;border:1px solid #16302a}
.sparkf{display:flex;justify-content:space-between;color:var(--dim);
  font-size:9px;margin-bottom:8px}
.feedkopf{color:var(--dim);font-size:10px;letter-spacing:1.5px;
  padding-bottom:10px;border-bottom:1px solid var(--rand);margin-bottom:6px}
.leerhinweis{color:var(--dim);font-size:11.5px;line-height:1.6;padding:14px 0}
.leerhinweis b{color:var(--phos)}
.ereig{border-left:3px solid var(--blut);padding:7px 0 7px 11px;margin:9px 0;
  background:#170909}
.ereig .ek{display:flex;justify-content:space-between;color:#ff8a8a;
  font-size:10px;letter-spacing:1.2px;font-weight:700;margin-bottom:4px}
.ereig .ek span{color:var(--dim);letter-spacing:0;font-weight:400}
.ereig .eq{color:var(--dim);font-size:9px;margin-top:4px}
.meld{border-left:2px solid #1f5a3e;padding:6px 0 6px 10px;margin:8px 0;
  background:#0a1310}
.meld .mk{display:flex;justify-content:space-between;color:var(--phos);
  font-size:10px;letter-spacing:1px;margin-bottom:3px}
.meld .mk span{color:var(--dim);letter-spacing:0}
.meld .mt{color:#cfe0d8;font-size:11.5px;line-height:1.45}
.quelle{margin-top:20px;padding-top:12px;border-top:1px solid var(--rand);
  color:var(--dim);font-size:10px;line-height:1.5}

/* Seitenpanel */
#panel{width:26%;min-width:320px;max-width:480px;flex:none;border-left:2px solid #16302a;background:var(--panel);
  display:flex;flex-direction:column;min-height:0;
  box-shadow:-14px 0 30px #00000066}
.pkopf{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;border-bottom:1px solid var(--rand);background:#070b10;
  color:var(--phos);font-size:10px;letter-spacing:2.5px;font-weight:700}
.pkopf button{background:none;border:1px solid #24403a;color:var(--ink2);
  width:22px;height:22px;cursor:pointer;font:inherit;font-size:14px;line-height:1}
.pkopf button:hover{color:var(--blut);border-color:var(--blut)}
#pInhalt{flex:1;overflow-y:auto;padding:20px 22px 40px;min-height:0}
#panel h2{margin:0;font-size:21px;line-height:1.25}
#panel .reg{color:var(--blau);font-size:11px;letter-spacing:2px;
  text-transform:uppercase;margin:6px 0 18px}
#panel h3{margin:22px 0 7px;font-size:12px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--ink2);font-weight:600}
#panel p{margin:0;color:#d3d9e2}
.fakten{border-top:1px solid var(--rand);border-bottom:1px solid var(--rand);
  padding:4px 0}
.fakten .z{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #1b2431}
.fakten .z:last-child{border-bottom:0}
.fakten .k{color:var(--dim);flex:none;width:88px;font-size:12px;
  text-transform:uppercase;letter-spacing:.7px;padding-top:1px}
.fakten .v{color:var(--ink);font-size:13px}
.tag{background:#3a2a12;color:#e0a03a;font-size:9px;padding:2px 6px;
  border-radius:3px;letter-spacing:.5px;margin-left:6px;vertical-align:middle}
.legende{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px;
  color:var(--ink2);font-size:12px}
.legende i{display:inline-block;width:12px;height:3px;border-radius:2px;
  margin-right:6px;vertical-align:middle}
.bt{width:100%;margin-top:14px;background:#1b2637;border:1px solid var(--rand);
  color:var(--ink);padding:9px 12px;border-radius:7px;cursor:pointer;font:inherit;
  font-size:13px}
.bt:hover{background:#24324a;border-color:#3a4c68}
body[data-ansicht="betroffen"] .bt{display:none}
ul.q{margin:0;padding-left:17px;color:var(--dim);font-size:12px}
ul.q li{margin-bottom:5px}

/* Liste */
#liste{display:none;padding:22px;gap:14px;overflow-y:auto;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-content:start}
.karte{text-align:left;background:var(--panel);border:1px solid var(--rand);
  border-radius:10px;padding:16px 18px;cursor:pointer;color:var(--ink);font:inherit}
.karte:hover{border-color:#33465e;background:#161f2c}
.karte h3{margin:0 0 3px;font-size:16px}
.karte .reg{color:var(--blau);font-size:10px;letter-spacing:1.6px;
  text-transform:uppercase;margin-bottom:9px}
.karte p{margin:0 0 10px;color:var(--ink2);font-size:12.5px}
.karte .mini{color:var(--dim);font-size:11px;border-top:1px solid var(--rand);
  padding-top:8px}

/* Statusleiste unten */
#lage{flex:none;display:flex;align-items:stretch;background:#070b10;
  border-top:1px solid var(--rand);font-size:10px;letter-spacing:1.6px}
#lage .f{padding:7px 16px;border-right:1px solid var(--rand);
  display:flex;align-items:center;gap:9px;color:var(--dim)}
#lage .f b{color:var(--ink);font-weight:700}
#lage .f.warn b{color:var(--amber)}
#lage .f.krit b{color:var(--blut)}
#lage .pkt{width:7px;height:7px;border-radius:50%;flex:none}
#lage .rechts{margin-left:auto;border-right:0;border-left:1px solid var(--rand);
  color:var(--dim)}

/* Was in welchem Modus sichtbar ist */
/* Die Meldungsspalte bleibt stehen — sie ist der Normalzustand, nicht die
   Ausnahme. Nur im Listen- und Quizmodus tritt sie zurück. */
body[data-modus="quiz"] #panel,
body[data-modus="liste"] #panel{display:none}
body[data-modus="liste"] #kartenfeld{display:none}
body[data-modus="liste"] #liste{display:grid;flex:1}
body[data-modus="quiz"] #quizleiste{display:block}
body:not([data-modus="quiz"]) #leiste{display:none}
body:not([data-modus="detail"]) #zurueck{display:none}
body[data-modus="detail"] #hinweis,body[data-modus="quiz"] #hinweis{display:none}

.lb.tr{border-left:1px solid var(--rand);padding-left:12px;margin-left:8px}

/* Ereignis-Einzelansicht im Panel */
.ekopf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.eart{background:#2a0d0d;border:1px solid #6b2020;color:#ff8a8a;
  padding:2px 8px;border-radius:3px;font-size:10.5px;font-weight:700;
  letter-spacing:.06em}
.etext{font-size:12.5px;line-height:1.7;color:var(--ink);
  border-left:2px solid var(--blut);padding-left:10px;margin-bottom:12px}
.efeld{border:1px solid var(--rand);border-radius:6px;overflow:hidden;
  margin-bottom:12px}
.ez{display:flex;gap:10px;padding:5px 9px;font-size:11px;
  border-bottom:1px solid #101a20}
.ez:last-child{border-bottom:0}
.ek2{color:var(--dim);flex:0 0 88px}
.ez span:last-child{color:var(--ink2);flex:1}
.ehinweis{color:var(--ink2);font-size:11px;line-height:1.6;
  background:#0c141b;border-radius:6px;padding:9px 10px;margin-bottom:10px}
.ewarn{color:var(--dim);font-size:11px;line-height:1.6;
  border:1px solid #4a3a10;background:#17130a;border-radius:6px;
  padding:9px 10px;margin-bottom:12px}
.ewarn b{color:var(--amber)}
.ebtn{display:block;width:100%;margin-bottom:7px;background:#0d2318;
  border:1px solid var(--phos);color:var(--phos);padding:7px;
  border-radius:5px;cursor:pointer;font:inherit;font-size:11px}
.ebtn:hover{background:#143623}
.ebtn.zweit{background:#111a1f;border-color:var(--rand);color:var(--ink2)}
.ebtn.zweit:hover{background:#16232a}
.geschaetzt{color:var(--amber);opacity:.85}
.fkl{color:var(--dim);font-size:10.5px;margin-top:4px;line-height:1.5;
  text-transform:none;letter-spacing:0}
.ereig:hover,.meld:hover{background:#0e1820}

/* Kurzlage in der Meldungsspalte — steht beim Start neben der Karte. */
.kurzlage{border:1px solid var(--rand);border-radius:6px;margin-bottom:12px;
  overflow:hidden}
.klk{background:#0c141b;padding:5px 9px;color:var(--dim);font-size:10px;
  letter-spacing:.1em;border-bottom:1px solid var(--rand)}
.klz{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid #101a20;padding:6px 9px;
  color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.klz:hover{background:#0e1820}
.kln{font-weight:700;white-space:nowrap}
.kla{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.klc{font-weight:700;color:var(--ink2)}
.klf{padding:5px 9px;color:var(--dim);font-size:10px;line-height:1.5}

/* Lagebild — Kachel je Kriegsschauplatz. */
/* Quiz-Bedienung */
#quizart,#stufen{display:flex;gap:4px;align-items:center;padding:5px 10px}
/* [hidden] allein reicht nicht — die display-Regel darüber gewinnt sonst. */
#stufen[hidden],#leiste .lb[hidden]{display:none}
.qa,.sb{background:#0a1219;border:1px solid var(--rand);color:var(--ink2);
  padding:4px 11px;border-radius:4px;cursor:pointer;font:inherit;font-size:10px;
  letter-spacing:.1em;white-space:nowrap}
.qa:hover,.sb:hover{border-color:var(--ink2);color:var(--ink)}
.qa.an,.sb.an{background:#0d2318;border-color:var(--phos);color:var(--phos);
  font-weight:700}
.sb span{color:var(--dim);font-weight:400;margin-left:3px}
.sb.an span{color:var(--phos);opacity:.7}

#quizleiste{display:none;flex:none;background:#070b10;
  border-top:1px solid var(--rand);padding:10px 16px}
.qzeile{display:flex;align-items:baseline;gap:14px}
.qlabel{color:var(--dim);font-size:9px;letter-spacing:2px;flex:none}
#qfrage{font-size:19px;font-weight:700;color:var(--phos);letter-spacing:1px;
  flex:none}
#qhilfe{color:var(--dim);font-size:11px}
#qergebnis{font-size:12px;font-weight:700}
#qergebnis.gut{color:var(--phos)}
#qergebnis.ok{color:var(--amber)}
#qergebnis.schlecht{color:#ff6b6b}
.qzeile .rechts{margin-left:auto;display:flex;align-items:center;gap:12px;
  flex:none}
#qpunkte{color:var(--ink2);font-size:12px;font-weight:700}
#weiter{background:#0d2318;border:1px solid var(--phos);color:var(--phos);
  padding:5px 16px;border-radius:4px;cursor:pointer;font:inherit;font-size:11px;
  letter-spacing:1px}
#weiter:hover{background:#143623}
#qinfo{margin-top:8px;padding-top:8px;border-top:1px solid var(--rand);
  color:var(--ink2);font-size:11px;line-height:1.6}
#qinfo b{color:var(--ink)}
#qinfo .q{color:var(--dim);font-size:10px;margin-left:8px}

@media (max-width:900px){
  #panel{position:absolute;inset:auto 0 0 0;width:auto;height:52%;
    border-left:0;border-top:1px solid var(--rand)}
  main{position:relative}
}
</style>
</head>
<body data-modus="quiz">

<header>
  <div class="logo"><b>◈</b> ATLAS</div>
  <nav>
    <button data-modus="quiz" class="an">Länder finden</button>
    <button data-modus="welt">Weltkarte</button>
    <button data-modus="liste">Meerengen</button>
  </nav>
  <div class="rechts">
    <span id="stand"></span> · Natural Earth (Public Domain) ·
    Handel: WTO Trade Profiles 2023
  </div>
</header>

<div id="leiste">
  <span class="lb">QUIZ</span>
  <div id="quizart">
    <button class="qa an" data-q="land">LÄNDER</button>
    <button class="qa" data-q="enge">MEERENGEN</button>
  </div>
  <span class="lb tr">STUFE</span>
  <div id="stufen"></div>
</div>

<main>
  <div id="kartenfeld">
    <canvas id="karte"></canvas>
    <button id="zurueck">← Weltkarte</button>
    <div id="ansichten">
      <button data-ansicht="enge" class="an">Die Enge</button>
      <button data-ansicht="betroffen">Wer hängt daran</button>
    </div>
    <div id="legende" hidden></div>
